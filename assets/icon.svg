<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Power Surge Circuit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02101d"/>
      <stop offset="1" stop-color="#010509"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#246bff"/>
      <stop offset="0.5" stop-color="#2ee7ff"/>
      <stop offset="1" stop-color="#a8fbff"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g opacity="0.5" stroke="#2ee7ff" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M56 160 H160 L200 120 H300"/>
    <path d="M56 256 H120 L160 296 H260 L300 256 H456"/>
    <path d="M56 352 H176 L216 392 H336"/>
  </g>
  <g fill="#2ee7ff" opacity="0.6">
    <circle cx="56" cy="160" r="6"/><circle cx="300" cy="120" r="6"/>
    <circle cx="56" cy="256" r="6"/><circle cx="456" cy="256" r="6"/>
    <circle cx="56" cy="352" r="6"/><circle cx="336" cy="392" r="6"/>
  </g>
  <g filter="url(#soft)">
    <path
      d="M292 74 L150 286 H246 L214 438 L366 216 H268 Z"
      fill="url(#glow)"
      stroke="#dffcff"
      stroke-width="8"
      stroke-linejoin="round"
    />
